<section id="{{ page.section-type }}" class="container content-section text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-12">
      <h2>Contact</h2>
      <p class="mt-3 mb-2">Feel free to reach out if you’d like to discuss platforms, data, or collaboration opportunities.</p>
      {% if site.email %}
        {% if site.email contains '@' %}
          {% assign newemail = site.email | split: '@' %}
          <p class="mb-1">
            <script>
              function join_at_email(user, domain) {
                return user && domain ? user + "@" + domain : "";
              }
              document.write(
                '<a href="mailto:' +
                  join_at_email("{{ newemail[0] }}", "{{ newemail[1] }}") +
                  '">' +
                  join_at_email("{{ newemail[0] }}", "{{ newemail[1] }}") +
                  "</a>"
              );
            </script>
          </p>
        {% else %}
          <p class="mb-1"><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        {% endif %}
      {% endif %}
    </div>
  </div>
</section>
